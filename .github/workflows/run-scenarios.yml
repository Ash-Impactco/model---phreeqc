name: Run ERW scenarios
on:
  workflow_dispatch:
  push:
    paths: ["data/**", "erw/**", "scripts/**"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/run_batch.py
      - run: python scripts/get_modflow.py
      - run: python scripts/run_groundwater.py
      - uses: actions/upload-artifact@v4
        with:
          name: erw-results
          path: outputs/
